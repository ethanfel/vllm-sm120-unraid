services:
  vllm:
    image: ghcr.io/ethanfel/vllm-sm120-unraid:0.2.0
    container_name: vLLM
    runtime: nvidia
    gpus: all
    ipc: host
    restart: unless-stopped
    stop_grace_period: 2m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - /mnt/user/appdata/vllm:/models
    env_file:
      - path: .env
        required: false
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      MODEL_ID: ${MODEL_ID:-DavidAU/Qwen3.6-27B-Fable-Fusion-711-Uncensored-Heretic-NM-DAU-MTP}
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-qwen3.6-27b-fable}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-131072}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.90}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-4}
      MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-8192}
      ENABLE_ON_DEMAND: ${ENABLE_ON_DEMAND:-true}
      IDLE_TIMEOUT_SECONDS: ${IDLE_TIMEOUT_SECONDS:-600}
      MODEL_LOAD_TIMEOUT_SECONDS: ${MODEL_LOAD_TIMEOUT_SECONDS:-1200}
      MODEL_STOP_TIMEOUT_SECONDS: ${MODEL_STOP_TIMEOUT_SECONDS:-120}
      MIN_FREE_VRAM_MIB: ${MIN_FREE_VRAM_MIB:-90000}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://host.docker.internal:8188}
      COMFYUI_FREE_TIMEOUT_SECONDS: ${COMFYUI_FREE_TIMEOUT_SECONDS:-120}
      VLLM_INTERNAL_PORT: ${VLLM_INTERNAL_PORT:-8001}
      MODEL_CACHE_DELETE_ENABLED: ${MODEL_CACHE_DELETE_ENABLED:-true}
      ENABLE_PREFIX_CACHING: ${ENABLE_PREFIX_CACHING:-true}
      ENABLE_TOOLS: ${ENABLE_TOOLS:-true}
      TOOL_CALL_PARSER: ${TOOL_CALL_PARSER:-qwen3_coder}
      ENABLE_MTP: ${ENABLE_MTP:-false}
      LANGUAGE_MODEL_ONLY: ${LANGUAGE_MODEL_ONLY:-false}
      LIMIT_MM_PER_PROMPT: '${LIMIT_MM_PER_PROMPT:-{"image":4,"video":0}}'
      DEFAULT_CHAT_TEMPLATE_KWARGS: '${DEFAULT_CHAT_TEMPLATE_KWARGS:-{"enable_thinking":true,"preserve_thinking":true}}'
      HF_TOKEN: ${HF_TOKEN:-}
      API_KEY: ${API_KEY:-}
